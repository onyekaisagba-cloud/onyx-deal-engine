<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 0.95rem;
      margin: 0;
      color: #38bdf8;
    }
    .badge {
      background: #2563eb;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .deal-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .deal-card img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
    }
    .deal-info {
      flex: 1;
      overflow: hidden;
    }
    .deal-info h4 {
      font-size: 0.8rem;
      margin: 0 0 4px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }
    .deal-price {
      font-size: 0.85rem;
      font-weight: bold;
      color: #4ade80;
    }
    .btn-claim {
      display: block;
      text-align: center;
      background: #ff9900;
      color: #111;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 6px;
      border-radius: 4px;
      margin-top: 6px;
    }
    .btn-claim:hover {
      background: #e68a00;
    }
    #loader {
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🔥 Onyx Top Tech Deals</h2>
    <span class="badge" id="deal-count">0 Live</span>
  </div>
  <div id="loader">Fetching active price drops...</div>
  <div id="deals-container"></div>
  <script src="popup.js"></script>
</body>
</html>
